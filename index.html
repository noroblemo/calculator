<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#090a0e" />
    <meta
      name="description"
      content="A small, dependency-free calculator with keyboard support and persistent history."
    />
    <title>Calculator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="calculator" aria-label="Calculator">
        <div class="display">
          <div class="expression" id="expression" aria-hidden="true"></div>
          <div class="result" id="result" role="status" aria-live="polite">0</div>
        </div>

        <div class="keys" id="keys">
          <button type="button" class="key key--function" data-action="clear" aria-label="All clear">AC</button>
          <button type="button" class="key key--function" data-action="sign" aria-label="Toggle sign">±</button>
          <button type="button" class="key key--function" data-action="percent" aria-label="Percent">%</button>
          <button type="button" class="key key--operator" data-operator="/" aria-label="Divide">÷</button>

          <button type="button" class="key" data-digit="7">7</button>
          <button type="button" class="key" data-digit="8">8</button>
          <button type="button" class="key" data-digit="9">9</button>
          <button type="button" class="key key--operator" data-operator="*" aria-label="Multiply">×</button>

          <button type="button" class="key" data-digit="4">4</button>
          <button type="button" class="key" data-digit="5">5</button>
          <button type="button" class="key" data-digit="6">6</button>
          <button type="button" class="key key--operator" data-operator="-" aria-label="Subtract">−</button>

          <button type="button" class="key" data-digit="1">1</button>
          <button type="button" class="key" data-digit="2">2</button>
          <button type="button" class="key" data-digit="3">3</button>
          <button type="button" class="key key--operator" data-operator="+" aria-label="Add">+</button>

          <button type="button" class="key key--zero" data-digit="0">0</button>
          <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
          <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>

      <aside class="history" aria-label="Calculation history">
        <div class="history__header">
          <h2>History</h2>
          <button type="button" class="history__clear" id="clearHistory">Clear</button>
        </div>
        <ul class="history__list" id="historyList"></ul>
        <p class="history__hint">
          Tip: numbers, operators, Enter and Backspace all work from your keyboard. Click any result to
          reuse it.
        </p>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
